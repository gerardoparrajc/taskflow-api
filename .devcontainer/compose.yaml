services:
  dev:
    image: mcr.microsoft.com/devcontainers/base:2-bookworm
    init: true
    command:
      - /bin/bash
      - -c
      - |
        set -eu
        chown vscode:vscode /home/vscode/.copilot /home/vscode/.vscode-server /home/vscode/.config/gh /home/vscode/.m2
        chmod 700 /home/vscode/.copilot /home/vscode/.vscode-server /home/vscode/.config/gh
        exec sleep infinity
    volumes:
      - ..:/workspaces/taskflow-api
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
    env_file:
      - ../.env
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
